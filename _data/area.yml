features:
- name: Public Transparency Reports
  description: Periodic public reports from platforms like Google, Cloudflare, Microsoft,
    Meta, Apple, Reddit, GitHub, and Twitter/X disclosing government and legal requests,
    takedowns, and content moderation actions.
- name: Public Status Pages
  description: Hosted status page surfaces (Statuspage, Better Stack, Atlassian Statuspage,
    Incident.io) communicating real-time service health, incidents, and scheduled
    maintenance to customers and the public.
- name: Public Audit Logs
  description: Audit log APIs and services (Cloudflare Audit Logs, Datadog Audit Trail,
    Microsoft Purview, Google Cloud Logging) that record administrative and security-relevant
    events in tamper-evident form.
- name: Cryptographic Transparency Logs
  description: Append-only, cryptographically verifiable logs such as Certificate
    Transparency, Sigstore Rekor, and Trillian that make issuance and signing events
    publicly auditable.
- name: Incident Communication
  description: Structured public disclosure of incidents, post-mortems, RCA, and ongoing
    impact via status pages, RSS, webhooks, and subscriber notifications.
- name: Government and Legal Request Disclosure
  description: Standardized reporting of government data requests, court orders, copyright
    takedowns, and national security requests across major platforms.
- name: Data-Broker and FOIA Disclosure
  description: Public disclosure portals for data brokers and government records,
    including Freedom of Information Act request handling and judicial disclosure.
use_cases:
- name: Subscribe to Status Page Incidents
  description: Programmatically subscribe to status page updates from providers like
    Statuspage, Better Stack, and Atlassian Statuspage and pipe them into incident
    response systems.
- name: Stream Public Audit Logs into a SIEM
  description: Pull tamper-evident audit logs from Cloudflare, Datadog, Microsoft
    Purview, and Google Cloud Logging into a centralized security information and
    event management platform.
- name: Verify Software Artifacts in a Transparency Log
  description: Query Sigstore Rekor or Certificate Transparency logs to verify that
    a signed artifact, certificate, or release was publicly recorded and is auditable.
- name: Monitor Certificate Issuance for a Domain
  description: Watch Certificate Transparency feeds (including Let's Encrypt CT submissions)
    for unauthorized or unexpected certificate issuance against owned domains.
- name: Aggregate Platform Transparency Reports
  description: Normalize and compare government request disclosures from Google, Cloudflare,
    Microsoft, Meta, Apple, Reddit, and Twitter/X for research and journalism.
- name: Publish Post-Incident Communication
  description: Use status page APIs to publish incidents, ongoing updates, post-mortems,
    and historical reliability metrics to customers and regulators.
- name: FOIA and Public Records Workflows
  description: Submit, track, and publish responses to Freedom of Information Act
    and judicial disclosure requests via public records APIs.
integrations:
- name: Statuspage
  description: Atlassian-owned hosted status page and incident communication platform
    with a REST API for pages, components, incidents, and subscribers.
- name: Better Stack
  description: Uptime monitoring and hosted status page platform with API access to
    monitors, heartbeats, incidents, and status pages.
- name: Sigstore Rekor
  description: Cryptographically secure, immutable transparency log for signed software
    releases, queryable via the Rekor API.
- name: Cloudflare
  description: Public Cloudflare Radar, transparency reports, and Audit Logs API providing
    visibility into traffic, requests, and tenant administrative activity.
- name: Google Cloud Logging
  description: Centralized audit and platform logging for Google Cloud, including
    Admin Activity and Data Access audit logs.
- name: Microsoft Purview
  description: Microsoft data governance and compliance platform that exposes audit
    logs across Microsoft 365 and Azure surfaces.
- name: Datadog
  description: Observability platform offering an Audit Trail and Audit Logs API for
    monitoring administrative activity across Datadog tenants.
- name: PagerDuty
  description: Incident response platform with public-facing status pages, post-mortems,
    and an API for incident disclosure and timelines.
